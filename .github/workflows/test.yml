name: CI
# Local runner (macOS uses OrbStack — https://orbstack.dev):
# Install act (https://github.com/nektos/act) then run:
#   act push                  # full CI
#   act push -j lint          # single job
#   act push -j test          # skip compose-demo (needs Docker-in-Docker)
# Branch pushes used to run CI twice (push + pull_request). Only main gets the push run.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a PR cancels its running CI; main runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uvx ruff@0.15.7 check .

  typecheck:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      # dagster/ imports the PyPI dagster package; install so mypy does not
      # treat the local dagster/ folder as the module. It is not in uv.lock.
      - run: uv sync --locked --extra dev && uv pip install -r requirements-dagster.txt
      - run: uv run --no-sync mypy ingestion/ transformations/ ml/ scripts/ dagster/

  test:
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra qa && uv pip install -r requirements-dagster.txt
      - run: uv run --no-sync pytest tests/ -v --tb=short --ignore=tests/integration --cov=ingestion --cov=transformations --cov=ml --cov-report=term-missing --cov-fail-under=70

  compose-demo:
    runs-on: ubuntu-latest
    needs: test
    # 30+ min full stack: main and manual runs only. Images install from
    # pyproject/requirements-dagster.txt, not uv.lock, so dep PRs lose little.
    if: github.event_name != 'pull_request'
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start core stack and run pipeline
        run: |
          make up
          make pipeline
      - name: Show container logs on failure
        if: failure()
        run: |
          docker ps -a
          docker logs --tail 200 sds-postgres || true
          docker logs --tail 200 sds-seaweedfs || true
          docker logs --tail 200 sds-hive-metastore || true
          docker logs --tail 200 sds-trino || true
          docker logs --tail 200 sds-dagster-webserver || true
          docker logs --tail 200 sds-dagster-daemon || true
          docker logs --tail 200 sds-mlflow || true
      - name: Stop stack
        if: always()
        run: make down
